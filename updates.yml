name: Refresh updates daily
on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 India time, every day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_updates.py
      - run: |
          git config user.name "updates-bot"
          git config user.email "bot@users.noreply.github.com"
          git add updates.json
          git diff --cached --quiet || (git commit -m "Daily refresh" && git push)
